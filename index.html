<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏸 Badminton Coach AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main>
  <h1>🏸 Badminton Coach AI</h1>
  <p class="sub">動画を選んで、AIコーチに分析してもらおう！</p>

  <section class="card">
    <label class="upload">
      <input id="video" type="file" accept="video/*">
      <span>📹 動画を選ぶ</span>
    </label>

    <video id="preview" controls playsinline hidden></video>

    <button id="analyze" disabled>分析スタート</button>
  </section>

  <section id="result" class="card result" hidden>
    <h2>🏸 サーバーからの結果</h2>

    <p class="note">分析結果を取得中...</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
